    />

    <title>rkinfinity</title>
    <!-- Cloudflare Web Analytics -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "36e7df933f1a489fb6f1870d6b819b2e"}'

    <script
      src="https://analytics.ahrefs.com/analytics.js"

      async
    ></script>
    <style>
      /* --- Loader styles --- */
      .loader-container {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #020817;
        transition:
          opacity 0.5s ease-in-out,
          visibility 0.5s ease-in-out;
        opacity: 1;
        visibility: visible;
      }

      .loader-container.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .spinner-logo {
        width: 150px;
        height: 150px;
        animation: spin 2.5s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      /* --- End Loader styles --- */
    </style>
  </head>
  <body>
    <!-- This loader is visible immediately -->
    <div id="initial-loader" class="loader-container">
      <!-- Using the logo for the pre-loader -->
      <img src="/rkinfinity-logo.png" alt="Loading..." class="spinner-logo" />
    </div>

    <!-- React app will mount here -->
    <div id="root"></div>

    <!-- The main script for the app -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Small script to hide the loader when the app is ready -->
    <script>
      const loader = document.getElementById("initial-loader");
      const root = document.getElementById("root");
      const observer = new MutationObserver(function (mutations, me) {
        if (root.children.length > 0) {
          loader.classList.add("hidden");
          me.disconnect();
        }
      });

      observer.observe(root, {
        childList: true,
      });
    </script>
  </body>
</html>
