name: Build CV downloads

on:
  push:
    branches: [main]
    paths:
      - "scripts/cv/build_cv.py"
      - ".github/workflows/cv-downloads.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-downloads-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document generators
        run: python -m pip install --upgrade pip reportlab python-docx pypdf

      - name: Generate and validate PDF and DOCX
        run: python scripts/cv/build_cv.py

      - name: Commit generated downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Raihan-Kabir-Professional-CV.pdf public/Raihan-Kabir-Professional-CV.docx
          if git diff --cached --quiet; then
            echo "CV downloads are already up to date."
          else
            git commit -m "Build professional CV PDF and DOCX downloads"
            git push origin main
          fi
